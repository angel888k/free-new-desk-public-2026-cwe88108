name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17.0.20+101' # Temurin 17.0.20.1+1 in Adoptium SemVer notation
      - name: Install locked dependencies
        run: npm ci
      - name: Cache pinned archive verification tools
        uses: actions/cache@v4
        with:
          path: third_party/build-tools/cache
          key: build-tools-${{ runner.os }}-${{ hashFiles('third_party/build-tools/SOURCE.json') }}
      - name: Validate pinned archive verification tools
        run: npm run prepare:builder-tools
      - name: Verify architecture, types, tests and renderer build
        run: npm run verify
